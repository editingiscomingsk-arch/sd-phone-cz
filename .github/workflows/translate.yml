name: Build Czech locale

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install translator
        run: pip install argostranslate

      - name: Generate Czech locale
        run: python translate.py

      - name: Validate JSON
        run: python -m json.tool cs.json > /dev/null

      - name: Commit generated locale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs.json translation-report.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Generate Czech SD-Phone locale"
            git push
          fi
